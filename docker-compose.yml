version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartexam_postgres
    environment:
      POSTGRES_USER: smartexam_user
      POSTGRES_PASSWORD: smartexam_secure_password
      POSTGRES_DB: smartexam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartexam_user -d smartexam_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartexam_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://smartexam_user:smartexam_secure_password@postgres:5432/smartexam_db
      - JWT_SECRET=production-secret-replace-with-secure-key
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smartexam_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
